# Prometheus scrapes the collector's metrics endpoint, and itself for health.
# The app never exposes metrics directly: the collector translates OTLP into
# the Prometheus exposition format on port 8889.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
