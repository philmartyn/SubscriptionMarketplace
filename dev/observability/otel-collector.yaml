# OpenTelemetry Collector for local development.
#
# The app's Java agent speaks OTLP only; the collector is the hub that turns
# that into the three things Grafana reads here: traces into Tempo, metrics into
# a Prometheus scrape endpoint, and logs into Loki's native OTLP endpoint.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch before export; the agent already batches, so this is mostly to keep
  # the exporter calls cheap.
  batch: {}

exporters:
  # Traces go straight to Tempo over OTLP.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics are exposed for Prometheus to scrape. Prometheus only knows how to
  # pull, so the collector publishes a /metrics endpoint it can scrape.
  # resource_to_telemetry_conversion turns resource attributes such as
  # service.name into labels, which is how dashboards filter per service.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Logs go to Loki's native OTLP endpoint. The otlphttp exporter appends
  # /v1/logs, so the endpoint is Loki's OTLP base, not the full path. Loki maps
  # resource attributes (service.name, deployment.environment) to index labels
  # and everything else to structured metadata; no encoding or hints needed.
  # The older `loki` exporter is deprecated in favour of this path.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
