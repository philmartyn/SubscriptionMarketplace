# Single-binary Loki for local development, mirroring tempo.yaml: one process,
# local storage, no object store.
#
# Logs arrive over OTLP at http://loki:3100/otlp from the collector, not via the
# older Loki push API. schema v13 is what enables structured metadata, so log
# attributes stay queryable without a JSON parser in LogQL. allow_structured_metadata
# defaults to true in Loki 3.x; it is set explicitly so a future config change
# cannot silently disable it.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  # /loki, not /var/loki: the image ships /loki owned by the unprivileged
  # loki user (10001), so a named volume mounted there inherits write access.
  # A fresh path under /var would be root-owned and Loki would fail to start.
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
